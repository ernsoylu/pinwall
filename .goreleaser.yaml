version: 2
project_name: pw

builds:
  - main: ./cmd/pw
    binary: pw
    env: ["CGO_ENABLED=0"]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, install.sh]

checksum:
  name_template: checksums.txt

changelog:
  use: git

# PW_INSTALL_URL is set by the release workflow, which mints the pin holding
# this release's install.sh before GoReleaser runs.
release:
  footer: |

    ## Install

    ```sh
    curl -fsSL --proto '=https' --proto-redir '=https' {{ .Env.PW_INSTALL_URL }} | sh
    ```

    Each release mints its own installer URL, so there is no long-lived edit
    token behind the script you pipe to `sh`. An older release's URL keeps
    working — the script resolves the latest version from GitHub when it runs.
