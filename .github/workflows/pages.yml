name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.22"
          cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:worker && go test ./...
      - run: deno test --allow-env
        working-directory: supabase/functions
      - run: sh -n install.sh && grep -q "checksum mismatch" install.sh
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy database and Edge Functions over SSH
        env:
          SUPABASE_SSH_HOST: ${{ vars.SUPABASE_SSH_HOST }}
          SUPABASE_SSH_KEY: ${{ secrets.SUPABASE_SSH_KEY }}
          SUPABASE_SSH_KNOWN_HOSTS: ${{ secrets.SUPABASE_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SUPABASE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes "root@$SUPABASE_SSH_HOST" 'mkdir -p /root/pinwall-deploy'
          tar czf - supabase/functions supabase/migrations scripts/deploy-supabase.sh |
            ssh -o BatchMode=yes "root@$SUPABASE_SSH_HOST" 'tar xzf - -C /root/pinwall-deploy'
          ssh -o BatchMode=yes "root@$SUPABASE_SSH_HOST" 'bash /root/pinwall-deploy/scripts/deploy-supabase.sh'
      - name: Check backend permissions and function protection
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/check-supabase.py
      - name: Deploy site and API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          EDGE_PROXY_SECRET: ${{ secrets.EDGE_PROXY_SECRET }}
        run: |
          printf '%s' "$EDGE_PROXY_SECRET" | ./node_modules/.bin/wrangler secret put EDGE_PROXY_SECRET
          ./node_modules/.bin/wrangler deploy --var "SUPABASE_FUNCTIONS_URL:$SUPABASE_FUNCTIONS_URL"
