name: Release pw
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.22"
          cache: false
      - run: go test ./...
      - name: Mint this release's installer pin
        run: |
          # Minted fresh each release, so there is no long-lived edit token and
          # nothing to keep in sync. Runs before the publish: if pw.pee.pw is
          # unreachable the release stops here rather than shipping notes with
          # an install command that does not work.
          tag=$(go run ./cmd/pw write < install.sh)
          url="https://pw.pee.pw/r/$tag"
          curl -fsSL --proto '=https' --proto-redir '=https' "$url" | cmp - install.sh
          echo "PW_INSTALL_URL=$url" >> "$GITHUB_ENV"
          echo "Installer for this release: $url"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
